# Rubric Refinement Experiment Configuration

# MySQL Database Configuration
# Update these with your actual MySQL credentials
[database]
host = localhost
port = 3306
database = mte241_labsdb
user = root
password = 
charset = utf8mb4

# LLM API Configuration
[llm]
api_base = http://ece-nebula16.eng.uwaterloo.ca:11434
model = gpt-oss:120b
timeout = 30
delay = 1.0
max_retries = 3

# Experiment Parameters
[experiment]
num_trials = 10
min_responses = 30
max_responses = 40
train_test_split = 0.7
max_refinements = 3
early_stop_threshold = 0.0

# Orthogonality Settings (for logging/metrics only, NOT used in refinement decisions)
# These metrics are still calculated and logged for analysis, but refinement
# decisions are based solely on flip rate and grading consistency metrics
[orthogonality]
threshold = 0.6
mi_weight = 0.4
correlation_weight = 0.3
cooccurrence_weight = 0.3

# Logging Settings
[logging]
log_level = INFO
save_interval = 100
verbose = true

# Output Settings
[output]
base_dir = experiments
save_grading_details = true
save_qd_scores = true
save_orthogonality_matrices = true  # Orthogonality matrices saved for analysis only
